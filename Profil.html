            font-family: Arial, sans-serif;

            margin: 0;
            padding: 30px 10px;

        /* TABEL UTAMA */
        table {
            width: 900px;

            border: 3px solid #e8cf57;

        }

        /* HEADER */

            color: #604b15;

        }

        }

            text-align: center;
            padding: 16px;
        }

        a {
            color: #98700b;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            color: #d49b00;
            text-decoration: underline;
        }

        /* EFEK HOVER ISI TABEL */
        tr:nth-child(3) td:hover {
            background-color: #fff6c7;
        }

        /* LIST TAUTAN */
        li {
            margin-bottom: 10px;
        }

        /* FOOTER */
        tr:last-child td {
            background-color: #ffe477;
            color: #604b15;
        }

        /* RESPONSIVE UNTUK HP */
        @media (max-width: 600px) {
            body {
                padding: 10px 5px;
            }

            table {
                width: 100%;
                font-size: 13px;
                border-radius: 16px;
            }

            td {
                padding: 10px;
                overflow-wrap: anywhere;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
